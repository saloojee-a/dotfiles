# Overrides merge with the language definitions bundled with Mitos v0.2.1.
# Two-space defaults mirror init.lua; Mitos still detects existing indentation.
# Formatters read stdin, use the real filename, and time out after 3 seconds.

[language-server.rust-analyzer.config]
check.command = "clippy"

[language-server.nil.config.nil.formatting]
command = ["alejandra"]

[language-server.lua-language-server.config.Lua]
completion.callSnippet = "Replace"
diagnostics.globals = ["vim"]
workspace.checkThirdParty = false
hint.enable = false

[language-server.ty.config.ty]
diagnosticMode = "openFilesOnly"
showSyntaxErrors = false

[language-server.vtsls.config]
typescript.suggest.autoImports = true
typescript.preferences.includePackageJsonAutoImports = "on"
javascript.suggest.autoImports = true
javascript.preferences.includePackageJsonAutoImports = "on"

[language-server.vscode-css-language-server.config]
css.lint.unknownAtRules = "ignore"
scss.lint.unknownAtRules = "ignore"

[language-server.yaml-language-server.config.yaml]
validate = true
hover = true
completion = true

[language-server.emmet-language-server]
command = "emmet-language-server"
args = ["--stdio"]

# Astro/Vue use the bundled project-relative tsdk setting.
[language-server.svelteserver.config.typescript]
tsdk = "node_modules/typescript/lib"

[[language]]
name = "lua"
formatter = { command = "stylua", args = ["--stdin-filepath","%{buffer_name}","-"], timeout = 3 }

[[language]]
name = "nix"
roots = ["flake.nix", "shell.nix", "default.nix", ".git"]
language-servers = ["nil"]
formatter = { command = "alejandra", timeout = 3 }

[[language]]
name = "rust"
roots = ["Cargo.toml", "rust-project.json"]
indent = { tab-width = 2, unit = "  " }
formatter = { command = "rustfmt", args = ["--emit","stdout"], timeout = 3 }

[[language]]
name = "python"
roots = ["ty.toml", "pyproject.toml", "ruff.toml", ".ruff.toml", "setup.py", "setup.cfg", "requirements.txt", ".git"]
indent = { tab-width = 2, unit = "  " }
language-servers = ["ty", { name = "ruff", except-features = ["hover"] }]
formatter = { command = "ruff", args = ["format","--stdin-filename","%{buffer_name}","-"], timeout = 3 }

[[language]]
name = "javascript"
language-servers = ["vtsls", "oxlint-language-server"]
formatter = { command = "oxfmt", args = ["--stdin-filepath","%{buffer_name}"], timeout = 3 }

[[language]]
name = "jsx"
language-servers = ["vtsls", "oxlint-language-server"]
formatter = { command = "oxfmt", args = ["--stdin-filepath","%{buffer_name}"], timeout = 3 }

[[language]]
name = "typescript"
language-servers = ["vtsls", "oxlint-language-server"]
formatter = { command = "oxfmt", args = ["--stdin-filepath","%{buffer_name}"], timeout = 3 }

[[language]]
name = "tsx"
language-servers = ["vtsls", "oxlint-language-server"]
formatter = { command = "oxfmt", args = ["--stdin-filepath","%{buffer_name}"], timeout = 3 }

[[language]]
name = "css"
formatter = { command = "oxfmt", args = ["--stdin-filepath","%{buffer_name}"], timeout = 3 }

[[language]]
name = "scss"
auto-format = false
